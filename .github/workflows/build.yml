name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32
          command: idf.py build && idf.py merge-bin -o instapunch-bridge-merged.bin
      - name: Collect flasher files
        run: |
          mkdir -p dist
          cp build/instapunch-bridge-merged.bin dist/
          cp web/index.html web/manifest.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: instapunch-bridge
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/instapunch-bridge-merged.bin

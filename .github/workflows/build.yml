name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the image to releases
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32
          command: idf.py build && idf.py merge-bin -o instapunch-bridge-merged.bin
      - name: Host tests (main/frame.c)
        run: make -C test
      - name: Collect flasher files
        run: |
          mkdir -p dist
          cp build/instapunch-bridge-merged.bin dist/
          cp web/index.html web/manifest.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: instapunch-bridge
          path: dist/
      # The web flasher (ESP Web Tools) needs HTTPS: GitHub Pages serves the page, manifest and image together.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/instapunch-bridge-merged.bin

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
